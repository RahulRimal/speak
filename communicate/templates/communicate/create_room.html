{% extends "base.html" %}

{% block title %}Create Room{% endblock %}

{% block content %}
<div class="create-room-container">
  <h1>Create a New Room</h1>

  <form method="POST" class="create-room-form">
    {% csrf_token %}
    <div class="form-group">
      <label for="room_name">Room Name:</label>
      <input
        type="text"
        id="room_name"
        name="name"
        placeholder="Enter room name"
        required
      />
    </div>
    <button type="submit" class="btn btn-primary">Create Room</button>
  </form>

  <p class="back-link">
    <a href="{% url 'home' %}">← Back to Home</a>
  </p>
</div>

<style>
  /* General Container */
  .create-room-container {
    max-width: 500px;
    margin: 50px auto;
    padding: 20px;
    background-color: #f9f9f9;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    text-align: center;
  }

  /* Title Styling */
  .create-room-container h1 {
    font-size: 1.8rem;
    color: #333;
    margin-bottom: 20px;
  }

  /* Form Styling */
  .create-room-form {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .form-group {
    text-align: left;
  }

  .form-group label {
    display: block;
    font-size: 1rem;
    color: #555;
    margin-bottom: 5px;
  }

  .form-group input {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 5px;
    transition: border-color 0.2s ease-in-out;
  }

  .form-group input:focus {
    border-color: #007bff;
    outline: none;
  }

  /* Button Styling */
  .btn-primary {
    padding: 10px 20px;
    font-size: 1rem;
    color: #fff;
    background-color: #007bff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .btn-primary:hover {
    background-color: #0056b3;
  }

  /* Back Link Styling */
  .back-link {
    margin-top: 15px;
  }

  .back-link a {
    color: #007bff;
    text-decoration: none;
    font-size: 0.9rem;
  }

  .back-link a:hover {
    text-decoration: underline;
  }
</style>
{% endblock %}
