{% extends "base.html" %}

{% block title %}Create Room{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center mt-5">
  <div class="card shadow-sm p-4" style="max-width: 500px; width: 100%;">
    <h1 class="h4 text-center mb-4">Create a New Room</h1>

    <form method="POST" class="d-flex flex-column gap-3">
      {% csrf_token %}
      
      <div class="mb-3">
        <label for="room_name" class="form-label">Room Name</label>
        <input
          type="text"
          id="room_name"
          name="name"
          class="form-control"
          placeholder="Enter room name"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary w-100">Create Room</button>
    </form>

    <div class="text-center mt-3">
      <a href="{% url 'home' %}" class="text-decoration-none text-primary">
        ← Back to Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
